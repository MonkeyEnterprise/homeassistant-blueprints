blueprint:
  name: "Professional Motion Controller - Version 1.0.1"
  description: "This automation manages your lighting and media based on motion across three distinct modes: Day, Evening, and Night. 1. Night Mode: Triggered when the Alarm Panel is set to Armed Night. 2. Evening Mode: Active between the set start and end times, provided the (optional) Lux sensor indicates it is dark. 3. Day Mode: The default fallback mode when neither of the above conditions are met. 4. Media Control: Supports separate actions for different media types. You can define which players should pause/resume (like Sonos) and which should turn off completely (like a TV). You can also choose if motion should resume, force start, or ignore the player. Each mode features independent settings for brightness, color temperature (Kelvin), transition duration, and off-delay timing."
  domain: automation
  input:
    # --- SECTION 1: SENSORS & SYSTEM MANAGEMENT ---
    sensor_selection:
      name: "1. Sensors & System Management"
      collapsed: true
      input:
        motion_sensor:
          name: "Motion Sensors"
          description: "Select one or more sensors. The automation triggers as soon as any of these sensors detect occupancy."
          selector:
            entity:
              domain: binary_sensor
              multiple: true
        alarm_panel:
          name: "Alarm Panel (Optional)"
          description: "Selection: If you select a panel, Night Mode activates when it is set to Armed Night. No Selection: The automation skips the Night Mode check entirely and defaults to Day/Evening logic."
          default: []
          selector:
            entity:
              domain: alarm_control_panel
        lux_sensor:
          name: "Dusk/Lux Sensor (Optional)"
          description: "Selection: Evening Mode only activates during the time window IF this sensor is On (dark). No Selection: The automation relies purely on the time clock."
          default: []
          selector:
            entity:
              domain: binary_sensor

    # --- SECTION 2: MEDIA CONTROL SETTINGS ---
    media_section:
      name: "2. Media Control (Optional)"
      collapsed: true
      input:
        media_pause_resume:
          name: "Media Players to Pause/Resume"
          description: "Selection: These players (e.g., Sonos) will pause when motion stops. No Selection: No pause actions will be performed."
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true
        media_motion_action:
          name: "Action when Motion is Detected"
          description: "Resume Only: Only starts if currently paused. Force Play: Always sends a play command. None: Only handles pausing when motion stops."
          default: "resume"
          selector:
            select:
              options:
                - label: "Resume Only (if paused)"
                  value: "resume"
                - label: "Force Play (always start)"
                  value: "play"
                - label: "No Action (only pause when motion stops)"
                  value: "none"
        media_turn_off:
          name: "Media Players to Turn Off"
          description: "Selection: These players (e.g., TV) will be turned off completely after the motion delay expires. No Selection: No turn-off actions will be performed."
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true

    # --- SECTION 3: DAY MODE SETTINGS ---
    day_mode_section:
      name: "3. Day Mode Settings"
      collapsed: true
      input:
        day_lights_on:
          name: "Day: Lights to turn ON"
          selector:
            target:
              entity:
                domain: light
        day_lights_off:
          name: "Day: Lights to turn OFF (Optional)"
          description: "Selection: These specific lights will be forced OFF when motion is detected. No Selection: No extra lights will be turned off."
          default: {}
          selector:
            target:
              entity:
                domain: light
        day_brightness:
          name: "Day: Brightness"
          default: 100
          selector:
            number: { min: 1, max: 100, unit_of_measurement: "%" }
        day_kelvin:
          name: "Day: Color Temperature"
          default: 3000
          selector:
            number: { min: 2000, max: 6500, unit_of_measurement: "K" }
        day_transition:
          name: "Day: Transition Time"
          default: 1
          selector:
            number: { min: 0, max: 60, unit_of_measurement: seconds }
        day_off_delay:
          name: "Day: Off-Delay"
          description: "How long the lights stay on after motion stops."
          default: 300
          selector:
            number: { min: 0, max: 3600, unit_of_measurement: seconds }

    # --- SECTION 4: EVENING MODE SETTINGS ---
    evening_mode_section:
      name: "4. Evening Mode Settings"
      collapsed: true
      input:
        evening_lights_on:
          name: "Evening: Lights to turn ON"
          selector:
            target:
              entity:
                domain: light
        evening_lights_off:
          name: "Evening: Lights to turn OFF (Optional)"
          description: "Selection: These lights turn off when motion starts in the evening."
          default: {}
          selector:
            target:
              entity:
                domain: light
        evening_start_time:
          name: "Evening: Start Time"
          default: "20:00:00"
          selector:
            time: {}
        evening_end_time:
          name: "Evening: End Time"
          default: "08:00:00"
          selector:
            time: {}
        evening_brightness:
          name: "Evening: Brightness"
          default: 30
          selector:
            number: { min: 1, max: 100, unit_of_measurement: "%" }
        evening_kelvin:
          name: "Evening: Color Temperature"
          default: 2500
          selector:
            number: { min: 2000, max: 6500, unit_of_measurement: "K" }
        evening_transition:
          name: "Evening: Transition Time"
          default: 2
          selector:
            number: { min: 0, max: 60, unit_of_measurement: seconds }
        evening_off_delay:
          name: "Evening: Off-Delay"
          default: 180
          selector:
            number: { min: 0, max: 3600, unit_of_measurement: seconds }

    # --- SECTION 5: NIGHT MODE SETTINGS ---
    night_mode_section:
      name: "5. Night Mode Settings"
      collapsed: true
      input:
        night_lights_on:
          name: "Night: Lights to turn ON"
          selector:
            target:
              entity:
                domain: light
        night_lights_off:
          name: "Night: Lights to turn OFF (Optional)"
          description: "Selection: These lights turn off when motion starts at night."
          default: {}
          selector:
            target:
              entity:
                domain: light
        night_brightness:
          name: "Night: Brightness"
          default: 5
          selector:
            number: { min: 1, max: 100, unit_of_measurement: "%" }
        night_kelvin:
          name: "Night: Color Temperature"
          default: 2000
          selector:
            number: { min: 2000, max: 6500, unit_of_measurement: "K" }
        night_transition:
          name: "Night: Transition Time"
          default: 2
          selector:
            number: { min: 0, max: 60, unit_of_measurement: seconds }
        night_off_delay:
          name: "Night: Off-Delay"
          default: 60
          selector:
            number: { min: 0, max: 3600, unit_of_measurement: seconds }

mode: restart

variables:
  v_sensors: !input motion_sensor
  v_alarm_panel: !input alarm_panel
  v_lux_sensor: !input lux_sensor
  v_media_pause: !input media_pause_resume
  v_media_off: !input media_turn_off
  v_media_motion_action: !input media_motion_action
  v_evening_start: !input evening_start_time
  v_evening_end: !input evening_end_time
  v_day_delay: !input day_off_delay
  v_evening_delay: !input evening_off_delay
  v_night_delay: !input night_off_delay
  v_day_off: !input day_lights_off
  v_evening_off: !input evening_lights_off
  v_night_off: !input night_lights_off

  v_motion_active: "{{ expand(v_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}"

  v_active_mode: >
    {% if v_alarm_panel != none and v_alarm_panel != [] and states(v_alarm_panel) == 'armed_night' %}
      night
    {% elif (now().strftime('%H:%M:%S') >= v_evening_start or now().strftime('%H:%M:%S') < v_evening_end) and (v_lux_sensor == none or v_lux_sensor == [] or is_state(v_lux_sensor, 'on')) %}
      evening
    {% else %}
      day
    {% endif %}

  v_current_delay: >
    {% if v_active_mode == 'night' %}{{ v_night_delay }}{% elif v_active_mode == 'evening' %}{{ v_evening_delay }}{% else %}{{ v_day_delay }}{% endif %}

trigger:
  - platform: state
    entity_id: !input motion_sensor

action:
  - choose:
      # --- SITUATION: MOTION DETECTED ---
      - conditions:
          - condition: template
            value_template: "{{ v_motion_active }}"
        sequence:
          # Media Motion Logic
          - if:
              - condition: template
                value_template: "{{ v_media_pause != none and v_media_pause != [] and v_media_motion_action != 'none' }}"
            then:
              - choose:
                  - conditions: "{{ v_media_motion_action == 'play' }}"
                    sequence:
                      - action: media_player.media_play
                        target:
                          entity_id: "{{ v_media_pause }}"
                  - conditions: "{{ v_media_motion_action == 'resume' }}"
                    sequence:
                      - repeat:
                          for_each: "{{ v_media_pause }}"
                          sequence:
                            - if:
                                - condition: template
                                  value_template: "{{ is_state(repeat.item, 'paused') }}"
                              then:
                                - action: media_player.media_play
                                  target:
                                    entity_id: "{{ repeat.item }}"

          # Lighting Logic
          - choose:
              - conditions: "{{ v_active_mode == 'night' }}"
                sequence:
                  - action: light.turn_on
                    target: !input night_lights_on
                    data:
                      brightness_pct: !input night_brightness
                      color_temp_kelvin: !input night_kelvin
                      transition: !input night_transition
                  - if: "{{ v_night_off.entity_id is defined or v_night_off.device_id is defined or v_night_off.area_id is defined }}"
                    then:
                      - action: light.turn_off
                        target: !input night_lights_off
              - conditions: "{{ v_active_mode == 'evening' }}"
                sequence:
                  - action: light.turn_on
                    target: !input evening_lights_on
                    data:
                      brightness_pct: !input evening_brightness
                      color_temp_kelvin: !input evening_kelvin
                      transition: !input evening_transition
                  - if: "{{ v_evening_off.entity_id is defined or v_evening_off.device_id is defined or v_evening_off.area_id is defined }}"
                    then:
                      - action: light.turn_off
                        target: !input evening_lights_off
              - conditions: []
                sequence:
                  - action: light.turn_on
                    target: !input day_lights_on
                    data:
                      brightness_pct: !input day_brightness
                      color_temp_kelvin: !input day_kelvin
                      transition: !input day_transition
                  - if: "{{ v_day_off.entity_id is defined or v_day_off.device_id is defined or v_day_off.area_id is defined }}"
                    then:
                      - action: light.turn_off
                        target: !input day_lights_off

      # --- SITUATION: MOTION STOPPED ---
      - conditions:
          - condition: template
            value_template: "{{ not v_motion_active }}"
        sequence:
          - delay: "{{ v_current_delay }}"
          - condition: template
            value_template: "{{ expand(v_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}"

          # Execute Media Pause
          - if:
              - condition: template
                value_template: "{{ v_media_pause != none and v_media_pause != [] }}"
            then:
              - action: media_player.media_pause
                target:
                  entity_id: "{{ v_media_pause }}"

          # Execute Media Turn Off
          - if:
              - condition: template
                value_template: "{{ v_media_off != none and v_media_off != [] }}"
            then:
              - action: media_player.turn_off
                target:
                  entity_id: "{{ v_media_off }}"

          # Turn off all lighting targets
          - action: light.turn_off
            target: !input day_lights_on
          - action: light.turn_off
            target: !input evening_lights_on
          - action: light.turn_off
            target: !input night_lights_on
